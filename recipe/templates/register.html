{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h2 class="text-center mb-3">Регистрация</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-2">Зарегистрироваться</button>
            </form>
            <div class="mt-3 text-center">
                <small class="text-muted">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
