{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Каталог рецептов{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-body text-body">

    <nav class="navbar navbar-expand-lg sticky-top bg-body-tertiary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'recipe_list' %}">🍳 Рецепты</a>

            <div class="d-flex align-items-center">
                <div class="navbar-nav flex-row me-3">
                    {% if user.is_authenticated %}
                        <a class="nav-link px-2" href="{% url 'add_recipe' %}">Добавить</a>
                        <a class="nav-link px-2" href="{% url 'profile' %}">Профиль</a>
                        <form action="{% url 'logout' %}" method="post" class="d-inline ms-2">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-danger btn-sm mt-1">Выйти</button>
                        </form>
                    {% else %}
                        <a class="nav-link px-2" href="{% url 'login' %}">Войти</a>
                        <a class="nav-link px-2" href="{% url 'register' %}">Регистрация</a>
                    {% endif %}
                </div>

                <button class="btn btn-sm btn-outline-secondary rounded-circle p-2 lh-1" id="themeToggleBtn" title="Сменить тему">
                    🌙
                </button>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'grey';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'grey' : 'dark';

            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
