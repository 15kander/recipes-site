{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h2 class="text-center mb-3">Вход в систему</h2>
            
            {% if form.errors %}
                <div class="alert alert-danger">
                    Неверное имя пользователя или пароль. Попробуйте снова.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-2">Войти</button>
            </form>
            
            <div class="mt-3 text-center">
                <small class="text-muted">Ещё нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
